application:
  name: docsgpt
  pods:
  - name: frontend
    image: arc53/docsgpt-fe:latest
    path: /
    command: sh -c "printf 'VITE_ALLOWED_HOSTS=relaxed-weasel-docsgpt.cloud.nexlayer.ai\n' > /app/.env.development.local && exec npm run dev -- --host"
    servicePorts:
    - 5173
    vars:
      VITE_API_HOST: <% URL %>
      VITE_API_STREAMING: "true"
  - name: backend
    image: arc53/docsgpt:latest
    path: /api
    servicePorts:
    - 7091
    vars:
      CELERY_BROKER_URL: redis://docsgpt-redis.pod:6379/0
      CELERY_RESULT_BACKEND: redis://docsgpt-redis.pod:6379/1
      CACHE_REDIS_URL: redis://docsgpt-redis.pod:6379/2
      POSTGRES_URI: postgresql://docsgpt:${POSTGRES_PASSWORD}@docsgpt-postgres.pod:5432/docsgpt
      LLM_PROVIDER: openai
      API_KEY: placeholder
      EMBEDDINGS_KEY: placeholder
    volumes:
    - name: docsgpt-data
      mountPath: /app/indexes
      size: 5Gi
  - name: docsgpt-redis
    image: redis:6-alpine
    servicePorts:
    - 6379
  - name: docsgpt-postgres
    image: postgres:16-alpine
    servicePorts:
    - 5432
    vars:
      POSTGRES_USER: docsgpt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: docsgpt
    volumes:
    - name: docsgpt-pgdata
      mountPath: /var/lib/postgresql/data
      size: 5Gi
